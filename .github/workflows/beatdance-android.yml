name: Build BeatDance Studio APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'beatdance/android/**'
      - '.github/workflows/beatdance-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: --no-daemon :app:assembleDebug
          build-root-directory: beatdance/android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatDance-Studio-APK
          path: beatdance/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
