name: Build GameStation Hub

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Reconstruct GameStation source
        run: |
          cat .github/gamestation/part1.txt .github/gamestation/part2.txt .github/gamestation/part3.txt .github/gamestation/part4.txt | base64 -d | tar -xz -C .
      - name: Build GameStation
        working-directory: gamestation-build
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameStation-Hub-v2
          path: gamestation-build/app/build/outputs/apk/debug/app-debug.apk
