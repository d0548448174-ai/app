name: Build Standalone Chipmunk APK

on:
  push:
    branches: ["main"]
    paths:
      - "chipmunk-android/**"
      - ".github/workflows/build-chipmunk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chipmunk-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build standalone chipmunk APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload chipmunk APK
        uses: actions/upload-artifact@v4
        with:
          name: chipmunk-voice-apk
          path: chipmunk-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
