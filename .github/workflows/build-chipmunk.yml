name: Build Chipmunk Voice APK

on:
  push:
    branches: ["main"]
    paths:
      - "chipmunk/**"
      - ".github/workflows/build-chipmunk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: chipmunk
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -f chipmunk/app/build/outputs/apk/debug/app-debug.apk
          ls -lh chipmunk/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChipmunkVoice-debug-apk
          path: chipmunk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
