name: Build Chipmunk Voice APK

on:
  push:
    branches: ["main"]
    paths:
      - "chipmunk/**"
      - ".github/workflows/build-chipmunk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: chipmunk
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        working-directory: chipmunk
        run: test -f build/outputs/apk/debug/chipmunk-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChipmunkVoice-debug-apk
          path: chipmunk/build/outputs/apk/debug/chipmunk-debug.apk
          if-no-files-found: error
