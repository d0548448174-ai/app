name: Build Digit AI

on:
  push:
    branches: ["main"]
    paths:
      - "digit_ai/**"
      - ".github/workflows/build-digit-ai.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: digit_ai
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Show APK
        run: ls -lh digit_ai/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DigitAI-debug-apk
          path: digit_ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
