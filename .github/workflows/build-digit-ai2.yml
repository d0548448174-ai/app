name: Build Digit AI Final

on:
  push:
    branches: ["main"]
    paths:
      - "digitai/**"
      - "settings.gradle"
      - ".github/workflows/build-digit-ai2.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon --stacktrace :digitai:assembleDebug

      - name: Show APK
        run: ls -lh digitai/build/outputs/apk/debug/digitai-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DigitAI-final-debug-apk
          path: digitai/build/outputs/apk/debug/digitai-debug.apk
          if-no-files-found: error
          retention-days: 7
