name: Build AI Image To 3D APK

on:
  push:
    branches: ["main"]
    paths:
      - "image3d-android/**"
      - ".github/workflows/build-image3d.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image3d-android

    steps:
      - uses: actions/checkout@v4

      - name: Download embedded Depth Anything V2 Small model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3             "https://huggingface.co/litert-community/depth-anything-v2-small/resolve/main/tflite/depth_anything_v2_small_wi8_afp32.tflite?download=true"             -o app/src/main/assets/depth_anything_v2_small_wi8_afp32.tflite
          ls -lh app/src/main/assets/depth_anything_v2_small_wi8_afp32.tflite

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build standalone ImageTo3D APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ImageTo3D APK
        uses: actions/upload-artifact@v4
        with:
          name: image-to-3d-ai-apk
          path: image3d-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
