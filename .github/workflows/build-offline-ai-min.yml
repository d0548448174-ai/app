name: Build Minimal Offline AI Test APK
on:
  push:
    branches: ["main"]
    paths:
      - "offline_ai_test_min/**"
      - ".github/workflows/build-offline-ai-min.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build minimal APK
        working-directory: offline_ai_test_min
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Show APK
        run: ls -lh offline_ai_test_min/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-Minimal-Test
          path: offline_ai_test_min/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
