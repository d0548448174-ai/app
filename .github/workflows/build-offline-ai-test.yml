name: Build Offline AI Test APK (No Model)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-offline-ai-test.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;29.0.13113456"             "cmake;3.31.6"

      - name: Get llama.cpp Android sample
        run: |
          git clone --depth 1 https://github.com/openalchemy/llama.cpp.git llama-src
          chmod +x llama-src/examples/llama.android/gradlew

      - name: Replace with test-only app
        working-directory: llama-src/examples/llama.android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          s = gradle.read_text()
          s = s.replace('namespace = "com.example.llama"', 'namespace = "com.example.offlineaitest"')
          s = s.replace('applicationId = "com.example.llama.aichat"', 'applicationId = "com.example.offlineaitest"')
          s = s.replace('debug {\n            isMinifyEnabled = true', 'debug {\n            isMinifyEnabled = false')
          gradle.write_text(s)

          manifest = Path("app/src/main/AndroidManifest.xml")
          ms = manifest.read_text()
          ms = ms.replace('android:label="@string/app_name"', 'android:label="🤖 AI אופליין - בדיקה"')
          manifest.write_text(ms)
          PY

          cat > app/src/main/java/com/example/llama/MainActivity.kt <<'KOT'
          package com.example.offlineaitest

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  findViewById<TextView>(R.id.title).text = "🤖 AI אופליין — בדיקת APK"
                  findViewById<TextView>(R.id.gguf).text =
                      "✅ האפליקציה נבנתה בהצלחה\nמצב בדיקה: ללא מודל מובנה"
                  val input = findViewById<EditText>(R.id.user_input)
                  val send = findViewById<Button>(R.id.fab_test)
                  send.setOnClickListener {
                      val text = input.text.toString().trim()
                      findViewById<TextView>(R.id.result).text =
                          if (text.isEmpty()) "כתוב הודעה לבדיקה"
                          else "✅ קלט התקבל: $text"
                  }
              }
          }
          KOT

          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="20dp"
              android:gravity="center_horizontal"
              android:background="#F7F4FF">

              <TextView
                  android:id="@+id/title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🤖 AI אופליין — בדיקה"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginTop="40dp"/>

              <TextView
                  android:id="@+id/gguf"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="טוען..."
                  android:textSize="16sp"
                  android:gravity="center"
                  android:layout_marginTop="20dp"/>

              <EditText
                  android:id="@+id/user_input"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="כתוב כאן לבדיקה"
                  android:layout_marginTop="40dp"/>

              <Button
                  android:id="@+id/fab_test"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="בדוק את האפליקציה"
                  android:layout_marginTop="12dp"/>

              <TextView
                  android:id="@+id/result"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="כאן תופיע תוצאת הבדיקה"
                  android:textSize="17sp"
                  android:gravity="center"
                  android:layout_marginTop="24dp"/>
          </LinearLayout>
          XML

      - name: Build test APK
        working-directory: llama-src/examples/llama.android
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Show APK size
        run: ls -lh llama-src/examples/llama.android/app/build/outputs/apk/debug/*.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-Test-NoModel
          path: llama-src/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
