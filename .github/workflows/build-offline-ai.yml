name: Build Offline AI Chat (Embedded Model)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-offline-ai.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Get llama.cpp Android sample
        run: |
          git clone --depth 1 https://github.com/openalchemy/llama.cpp.git llama-src
          test -f llama-src/examples/llama.android/gradlew
          chmod +x llama-src/examples/llama.android/gradlew

      - name: Download embedded AI model
        working-directory: llama-src/examples/llama.android
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q3_k_m.gguf?download=true" \
            -o app/src/main/assets/model.gguf
          test -s app/src/main/assets/model.gguf
          ls -lh app/src/main/assets/model.gguf

      - name: Replace application package and UI
        working-directory: llama-src/examples/llama.android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          s = gradle.read_text()
          s = s.replace('namespace = "com.example.llama"', 'namespace = "com.example.offlineai"')
          s = s.replace('applicationId = "com.example.llama.aichat"', 'applicationId = "com.example.offlineai"')
          s = s.replace('debug {\n            isMinifyEnabled = true', 'debug {\n            isMinifyEnabled = false')
          s = s.replace('versionName = "1.0"', 'versionName = "1.0"')
          # Keep the GGUF asset uncompressed so it can be copied efficiently on first launch.
          s = s.replace(
              '    dependencies {',
              '    androidResources {\n        noCompress += "gguf"\n    }\n\n    dependencies {'
          )
          gradle.write_text(s)

          manifest = Path("app/src/main/AndroidManifest.xml")
          ms = manifest.read_text()
          ms = ms.replace('android:label="@string/app_name"', 'android:label="🤖 AI אופליין"')
          manifest.write_text(ms)
          PY

          cat > app/src/main/java/com/example/llama/MainActivity.kt <<'KOT'
          package com.example.offlineai

          import android.os.Bundle
          import android.util.Log
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.addCallback
          import androidx.activity.enableEdgeToEdge
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.arm.aichat.AiChat
          import com.arm.aichat.InferenceEngine
          import com.google.android.material.floatingactionbutton.FloatingActionButton
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.flow.onCompletion
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.util.UUID

          class MainActivity : AppCompatActivity() {
              private lateinit var statusTv: TextView
              private lateinit var messagesRv: RecyclerView
              private lateinit var userInputEt: EditText
              private lateinit var sendFab: FloatingActionButton
              private lateinit var engine: InferenceEngine
              private var generationJob: Job? = null
              private var isModelReady = false
              private val messages = mutableListOf<Message>()
              private val lastAssistantMsg = StringBuilder()
              private val adapter = MessageAdapter(messages)

              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  enableEdgeToEdge()
                  setContentView(R.layout.activity_main)
                  onBackPressedDispatcher.addCallback { }

                  statusTv = findViewById(R.id.gguf)
                  messagesRv = findViewById(R.id.messages)
                  messagesRv.layoutManager = LinearLayoutManager(this).apply { stackFromEnd = true }
                  messagesRv.adapter = adapter
                  userInputEt = findViewById(R.id.user_input)
                  sendFab = findViewById(R.id.fab)

                  userInputEt.hint = "כתוב הודעה..."
                  userInputEt.isEnabled = false
                  sendFab.isEnabled = false
                  statusTv.text = "🤖 טוען את הבינה המלאכותית המובנית..."

                  lifecycleScope.launch(Dispatchers.Default) {
                      try {
                          engine = AiChat.getInferenceEngine(applicationContext)
                          val model = ensureBundledModel()
                          engine.loadModel(model.path)
                          withContext(Dispatchers.Main) {
                              isModelReady = true
                              userInputEt.isEnabled = true
                              sendFab.isEnabled = true
                              statusTv.text = "✅ AI מוכן — עובד ללא אינטרנט"
                              Toast.makeText(this@MainActivity, "המודל נטען בהצלחה", Toast.LENGTH_SHORT).show()
                          }
                      } catch (t: Throwable) {
                          Log.e(TAG, "Model init failed", t)
                          withContext(Dispatchers.Main) {
                              statusTv.text = "❌ טעינת המודל נכשלה"
                              Toast.makeText(this@MainActivity, "לא הצלחתי לטעון את המודל", Toast.LENGTH_LONG).show()
                          }
                      }
                  }

                  sendFab.setOnClickListener {
                      if (isModelReady) handleUserInput()
                  }
              }

              private suspend fun ensureBundledModel(): File = withContext(Dispatchers.IO) {
                  val dir = File(filesDir, "models").also { if (!it.exists()) it.mkdirs() }
                  val file = File(dir, "qwen15b-q3km.gguf")
                  if (!file.exists() || file.length() < 700_000_000L) {
                      assets.open("model.gguf").use { input ->
                          FileOutputStream(file).use { output -> input.copyTo(output, 1024 * 1024) }
                      }
                  }
                  file
              }

              private fun handleUserInput() {
                  val text = userInputEt.text.toString().trim()
                  if (text.isEmpty()) return
                  userInputEt.text = null
                  userInputEt.isEnabled = false
                  sendFab.isEnabled = false

                  messages.add(Message(UUID.randomUUID().toString(), text, true))
                  lastAssistantMsg.clear()
                  messages.add(Message(UUID.randomUUID().toString(), "", false))
                  adapter.notifyItemRangeChanged(0, messages.size)
                  messagesRv.scrollToPosition(messages.size - 1)

                  generationJob = lifecycleScope.launch(Dispatchers.Default) {
                      engine.sendUserPrompt(text)
                          .onCompletion {
                              withContext(Dispatchers.Main) {
                                  userInputEt.isEnabled = true
                                  sendFab.isEnabled = true
                                  messagesRv.scrollToPosition(messages.size - 1)
                              }
                          }
                          .collect { token ->
                              withContext(Dispatchers.Main) {
                                  val i = messages.lastIndex
                                  if (i >= 0 && !messages[i].isUser) {
                                      messages[i] = messages[i].copy(
                                          content = lastAssistantMsg.append(token).toString()
                                      )
                                      adapter.notifyItemChanged(i)
                                      messagesRv.scrollToPosition(i)
                                  }
                              }
                          }
                  }
              }

              override fun onStop() {
                  generationJob?.cancel()
                  super.onStop()
              }

              override fun onDestroy() {
                  if (::engine.isInitialized) engine.destroy()
                  super.onDestroy()
              }

              companion object {
                  private const val TAG = "OfflineAI"
              }
          }
          KOT

          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F7F4FF">

              <TextView
                  android:id="@+id/title"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:paddingStart="22dp"
                  android:paddingTop="24dp"
                  android:paddingEnd="22dp"
                  android:text="🤖 AI אופליין"
                  android:textColor="#2A2138"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent"/>

              <TextView
                  android:id="@+id/gguf"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:paddingStart="22dp"
                  android:paddingTop="4dp"
                  android:paddingEnd="22dp"
                  android:paddingBottom="12dp"
                  android:text="טוען..."
                  android:textColor="#6D6478"
                  android:textSize="14sp"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toBottomOf="@id/title"/>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/messages"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:clipToPadding="false"
                  android:scrollbars="vertical"
                  app:layout_constraintBottom_toTopOf="@id/input_bar"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toBottomOf="@id/gguf"/>

              <LinearLayout
                  android:id="@+id/input_bar"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_margin="12dp"
                  android:background="@drawable/input_background"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="14dp"
                  android:paddingTop="6dp"
                  android:paddingEnd="6dp"
                  android:paddingBottom="6dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent">

                  <EditText
                      android:id="@+id/user_input"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:background="@android:color/transparent"
                      android:gravity="center_vertical"
                      android:inputType="textCapSentences|textMultiLine"
                      android:maxLines="4"
                      android:minHeight="52dp"
                      android:padding="8dp"
                      android:textSize="16sp"/>

                  <com.google.android.material.floatingactionbutton.FloatingActionButton
                      android:id="@+id/fab"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:contentDescription="שלח"
                      android:src="@drawable/outline_send_24"
                      app:fabSize="mini"/>

              </LinearLayout>
          </androidx.constraintlayout.widget.ConstraintLayout>
          XML

          cat > app/src/main/res/drawable/input_background.xml <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="28dp"/>
              <stroke android:width="1dp" android:color="#E4DDF2"/>
          </shape>
          XML

          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/res/values/strings.xml")
          if p.exists():
              s=p.read_text()
              s=s.replace("AiChat", "AI אופליין").replace("Ai Chat", "AI אופליין")
              p.write_text(s)
          PY

      - name: Build APK
        working-directory: llama-src/examples/llama.android
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Show APK size
        run: ls -lh llama-src/examples/llama.android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-Embedded-APK
          path: llama-src/examples/llama.android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
