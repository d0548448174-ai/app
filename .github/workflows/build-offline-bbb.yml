name: Build offline Big Buck Bunny HTML

on:
  push:
    paths:
      - ".github/workflows/build-offline-bbb.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the actual MP4 from GitHub
        run: |
          curl -L --fail --retry 3 -o big_buck_bunny.mp4 "https://raw.githubusercontent.com/andreasbotsikas/DemoVideos/master/big_buck_bunny.mp4"
          test -s big_buck_bunny.mp4
          ls -lh big_buck_bunny.mp4

      - name: Create self-contained HTML
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64encode(Path("big_buck_bunny.mp4").read_bytes()).decode("ascii")
          html = '''<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Buck Bunny — אופליין</title>
<style>
html,body{margin:0;background:#0b0f14;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.card{width:min(1100px,100%);background:#151b24;border-radius:20px;padding:18px;box-sizing:border-box}
h1{text-align:center;font-size:clamp(20px,4vw,34px)}
video{display:block;width:100%;border-radius:14px;background:#000}
.note{text-align:center;color:#b8c2cf;font-size:14px}
</style>
</head>
<body>
<main class="card">
<h1>🎬 Big Buck Bunny — אופליין</h1>
<video controls playsinline preload="metadata">
<source src="data:video/mp4;base64,''' + data + '''" type="video/mp4">
הדפדפן שלך לא תומך בניגון וידאו.
</video>
<div class="note">הווידאו משולב בתוך קובץ ה‑HTML עצמו.</div>
</main>
</body>
</html>
'''
          Path("Big_Buck_Bunny_OFFLINE.html").write_text(html, encoding="utf-8")
          print(Path("Big_Buck_Bunny_OFFLINE.html").stat().st_size)
          PY
          ls -lh Big_Buck_Bunny_OFFLINE.html

      - name: Publish the HTML as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "offline-bbb-${{ github.run_number }}" Big_Buck_Bunny_OFFLINE.html --title "Big Buck Bunny — HTML אופליין" --notes "Standalone HTML with the MP4 embedded directly inside the HTML." --latest
