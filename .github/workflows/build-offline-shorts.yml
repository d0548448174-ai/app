name: Build Offline Shorts APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'offline_shorts/**'
      - '.github/workflows/build-offline-shorts.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon -p offline_shorts assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineShorts-debug-apk
          path: offline_shorts/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
