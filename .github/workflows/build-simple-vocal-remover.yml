name: Build Simple Vocal Remover

on:
  push:
    branches: [ "main" ]
    paths:
      - "simple_vocal_remover/**"
      - ".github/workflows/build-simple-vocal-remover.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle project
        run: |
          mkdir -p build/simple/app
          cp -r simple_vocal_remover/* build/simple/app/
          cd build/simple
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="simple-vocal-remover"
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: build/simple
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVocalRemover-debug-apk
          path: build/simple/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
