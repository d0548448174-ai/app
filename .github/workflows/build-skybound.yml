name: Build Skybound Dash APK

on:
  push:
    paths:
      - "skybound_dash/**"
      - ".github/workflows/build-skybound.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Download Godot 4.5.1
        run: |
          wget -q https://downloads.tuxfamily.org/godotengine/4.5.1/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          sudo mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          wget -q https://downloads.tuxfamily.org/godotengine/4.5.1/Godot_v4.5.1-stable_export_templates.tpz
          unzip -q Godot_v4.5.1-stable_export_templates.tpz
          cp -r templates/. ~/.local/share/godot/export_templates/4.5.1.stable/
          printf "4.5.1.stable\n" > ~/.local/share/godot/export_templates/4.5.1.stable/version.txt

      - name: Export debug APK
        working-directory: skybound_dash
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          mkdir -p ../build/skybound
          godot --headless --verbose --export-debug "Android" ../build/skybound/SkyboundDash.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skybound-Dash-APK
          path: build/skybound/SkyboundDash.apk
          if-no-files-found: error
          retention-days: 14
