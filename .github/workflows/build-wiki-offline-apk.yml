name: Build Hebrew Wikipedia Offline APK

on:
  push:
    branches: [wiki-offline-android]
    paths:
      - 'wiki-offline/**'
      - '.github/workflows/build-wiki-offline-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get Kiwix Android source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kiwix/kiwix-android.git "$RUNNER_TEMP/kiwix-android"
          echo "UPSTREAM_DIR=$RUNNER_TEMP/kiwix-android" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/kiwix-android" rev-parse HEAD > "$RUNNER_TEMP/kiwix-commit.txt"

      - name: Download the Hebrew Wikipedia mini ZIM (no pictures)
        shell: bash
        run: |
          set -euo pipefail
          ZIM_NAME='wikipedia_he_all_mini_2026-07a.zim'
          mkdir -p "$UPSTREAM_DIR/app/src/main/assets"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 \
            "https://download.kiwix.org/zim/wikipedia/$ZIM_NAME" \
            --output "$UPSTREAM_DIR/app/src/main/assets/$ZIM_NAME"
          SIZE=$(stat -c '%s' "$UPSTREAM_DIR/app/src/main/assets/$ZIM_NAME")
          if [ "$SIZE" -lt $((700 * 1024 * 1024)) ]; then
            echo "Downloaded ZIM is unexpectedly small: $SIZE bytes" >&2
            exit 1
          fi
          echo "ZIM_NAME=$ZIM_NAME" >> "$GITHUB_ENV"
          echo "ZIM_BYTES=$SIZE" >> "$GITHUB_ENV"

      - name: Apply the custom name, bundled ZIM, and image-free reader
        run: python3 wiki-offline/patch_upstream.py "$UPSTREAM_DIR"

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$UPSTREAM_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo 'Could not locate APK output' >&2
            find app/build/outputs/apk -type f -maxdepth 4 -print >&2 || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/dist/Wikipedia-Offline-HE.apk"
          {
            echo "Upstream Kiwix commit: $(cat "$RUNNER_TEMP/kiwix-commit.txt")"
            echo "Bundled ZIM: $ZIM_NAME"
            echo "Bundled ZIM bytes: $ZIM_BYTES"
            echo "APK SHA-256: $(sha256sum "$GITHUB_WORKSPACE/dist/Wikipedia-Offline-HE.apk" | cut -d ' ' -f 1)"
          } > "$GITHUB_WORKSPACE/dist/build-info.txt"

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wiki-offline-v1.0.0-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: 'ויקיפדיה אופליין - בנייה ${{ github.run_number }}'
          prerelease: true
          body: |
            APK ניסיוני לאנדרואיד.

            כולל מאגר ZIM עברי ללא תמונות בתוך האפליקציה. בהפעלה הראשונה האפליקציה מעתיקה את המאגר לאחסון המכשיר; נדרש מקום פנוי של כ־1.6GB ומומלץ לפתוח מחדש את האפליקציה לאחר שההעתקה מסתיימת.

            הפרויקט מבוסס על Kiwix Android בקוד פתוח (GPL-3.0-or-later); קובץ ה-ZIM מקורו ב-Kiwix.
          files: |
            dist/Wikipedia-Offline-HE.apk
            dist/build-info.txt
