name: Deploy Zipedia to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "zipedia/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-zipedia.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zipedia-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fetch matching upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.95 https://github.com/openzim/javascript-libzim.git /tmp/javascript-libzim

      - name: Add explicit alphabetical-range API
        run: python3 .github/scripts/patch-libzim-bindings.py /tmp/javascript-libzim/libzim_bindings.cpp

      - name: Build the WebAssembly reader from source
        shell: bash
        run: |
          set -euo pipefail
          docker build -t docker-emscripten-libzim:v3 --build-arg VERSION=3.1.41 /tmp/javascript-libzim/docker
          docker run --rm -v /tmp/javascript-libzim:/src -u "$(id -u):$(id -g)" docker-emscripten-libzim:v3 make

      - name: Assemble the local reader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zipedia/vendor
          cp /tmp/javascript-libzim/libzim-wasm.js zipedia/vendor/libzim-wasm.js
          cp /tmp/javascript-libzim/libzim-wasm.wasm zipedia/vendor/libzim-wasm.wasm
          python3 .github/scripts/patch-libzim-worker.py
          grep -q "forceRangeSuggestion" zipedia/vendor/libzim-wasm.js
          grep -q "listTitles" zipedia/vendor/libzim-wasm.js
          test -s zipedia/vendor/libzim-wasm.wasm

      - name: Validate JavaScript and app markup
        shell: bash
        run: |
          set -euo pipefail
          node --check zipedia/app.js
          node --check zipedia/vendor/libzim-wasm.js
          python3 .github/scripts/check-zipedia.py
          test -s zipedia/index.html
          test -s zipedia/styles.css
          test -s zipedia/README.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: zipedia

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
