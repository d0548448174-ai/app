name: Deploy Zipedia to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "zipedia/**"
      - ".github/scripts/patch-libzim-worker.py"
      - ".github/workflows/deploy-zipedia.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zipedia-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download libzim WebAssembly runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zipedia/vendor /tmp/libzim-release
          curl --fail --location --silent --show-error --retry 3 \
            https://download.openzim.org/release/javascript-libzim/libzim_wasm_0.95.zip \
            --output /tmp/libzim-release/libzim_wasm.zip
          unzip -q /tmp/libzim-release/libzim_wasm.zip -d /tmp/libzim-release/unpacked

          JS_PATH="$(find /tmp/libzim-release/unpacked -type f -name 'libzim-wasm.js' -print -quit)"
          WASM_PATH="$(find /tmp/libzim-release/unpacked -type f -name 'libzim-wasm.wasm' -print -quit)"
          test -n "$JS_PATH" || { echo 'libzim-wasm.js was not found in the official release archive'; exit 1; }
          test -n "$WASM_PATH" || { echo 'libzim-wasm.wasm was not found in the official release archive'; exit 1; }

          cp "$JS_PATH" zipedia/vendor/libzim-wasm.js
          cp "$WASM_PATH" zipedia/vendor/libzim-wasm.wasm
          test -s zipedia/vendor/libzim-wasm.js
          test -s zipedia/vendor/libzim-wasm.wasm

      - name: Add paginated alphabetical title index
        run: python3 .github/scripts/patch-libzim-worker.py

      - name: Validate JavaScript and required files
        shell: bash
        run: |
          set -euo pipefail
          node --check zipedia/app.js
          test -s zipedia/index.html
          test -s zipedia/styles.css
          grep -q "listTitles" zipedia/vendor/libzim-wasm.js
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("zipedia/index.html").read_text(encoding="utf-8")
          app = Path("zipedia/app.js").read_text(encoding="utf-8")
          ids = set(re.findall(r'\bid=["\\x27]([^"\\x27]+)', html))
          refs = set(re.findall(r'\$\(["\\x27]([^"\\x27]+)', app))
          missing = sorted(refs - ids)
          if missing:
              raise SystemExit("Missing HTML element IDs: " + ", ".join(missing))
          print("Static checks passed; all app element IDs exist.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: zipedia

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
