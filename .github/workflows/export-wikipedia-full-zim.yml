name: Export full Hebrew Wikipedia ZIM in transferable parts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-wikipedia-full-zim.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep one exporter active at a time; a newer run replaces a stalled run.
concurrency:
  group: full-hebrew-wikipedia-zim-export
  cancel-in-progress: true

jobs:
  export-full-zim:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download and validate full Hebrew Wikipedia without pictures
        shell: bash
        run: |
          set -euo pipefail
          file="wikipedia_he_all_nopic_2026-07a.zim"
          success=0
          for base in \
            "https://download.kiwix.org/zim/wikipedia" \
            "https://ftpmirror.your.org/pub/kiwix/zim/wikipedia" \
            "https://thuli.pics/kiwix/zim/wikipedia"; do
            echo "Trying $base/$file"
            # Preserve the partial download when moving between mirrors.
            # A stalled mirror gets at most 15 minutes; low throughput for
            # 2 minutes causes an early failover instead of hours of waiting.
            if curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 900 \
              --speed-limit 65536 --speed-time 120 \
              --continue-at - "$base/$file" --output "$file"; then
              size="$(stat -c '%s' "$file")"
              magic="$(head -c 4 "$file" | od -An -tx1 | tr -d ' \\n')"
              echo "Downloaded $size bytes; ZIM magic=$magic"
              if [ "$size" -gt 2500000000 ] && [ "$magic" = "5a494d04" ]; then
                success=1
                break
              fi
              echo "Archive failed size/header validation; restarting from zero on the next source." >&2
              rm -f "$file"
            else
              echo "This source failed or stalled; switching to the next mirror." >&2
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "Could not download and validate full Hebrew Wikipedia from configured mirrors." >&2
            exit 1
          fi
          echo "Full archive size: $(du -h "$file" | cut -f1)"
      - name: Split archive into 75 MB transfer parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts
          split --bytes=75000000 --numeric-suffixes=0 --suffix-length=2 \
            --additional-suffix=.part wikipedia_he_all_nopic_2026-07a.zim parts/wikipedia-he-nopic-
          count="$(find parts -name 'wikipedia-he-nopic-*.part' -type f | wc -l)"
          echo "Created $count parts"
          test "$count" -ge 30
          test "$count" -le 50
          sha256sum parts/wikipedia-he-nopic-*.part > parts/SHA256SUMS.txt
          cat parts/SHA256SUMS.txt
      - name: Upload full ZIM part 00
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-he-nopic-part-00
          path: parts/wikipedia-he-nopic-00.part
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload full ZIM part 01
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-he-nopic-part-01
          path: parts/wikipedia-he-nopic-01.part
