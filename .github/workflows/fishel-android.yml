name: Build Fishel Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'fishel/**'
      - '.github/workflows/fishel-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        working-directory: fishel
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Fishel com.bluejelly.fishel --web-dir .
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: fishel/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fishel-debug-apk
          path: fishel/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
