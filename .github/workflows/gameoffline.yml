name: Build GameOffline APK
on:
  push:
    paths:
      - 'gameoffline/**'
      - '.github/workflows/gameoffline.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: gameoffline
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp gameoffline/app/build/outputs/apk/debug/app-debug.apk GameOffline.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameOffline-debug-apk
          path: GameOffline.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="gameoffline-v2"
          APK="GameOffline.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "GameOffline v2 — 10 Offline Games" --notes "Android APK with 10 offline mini-games. Built automatically with GitHub Actions."
          fi
