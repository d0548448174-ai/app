name: Build GameStation V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'gamestation-v2/**'
      - '.github/workflows/gamestation-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build GameStation V2
        working-directory: gamestation-v2
        run: gradle assembleDebug --no-daemon
      - name: Upload GameStation V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: GameStation-V2-debug
          path: gamestation-v2/app/build/outputs/apk/debug/app-debug.apk
