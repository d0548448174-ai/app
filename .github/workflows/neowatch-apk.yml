name: Build NEOWATCH APK

on:
  push:
    branches: ["main", "neowatch-android"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neowatch-android
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neowatch-apk
          path: neowatch-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neowatch-latest
          name: NEOWATCH APK
          body: Android APK built automatically from the NEOWATCH wrapper.
          prerelease: true
          files: neowatch-android/app/build/outputs/apk/debug/app-debug.apk

  offline_bunny:
    runs-on: ubuntu-latest
    steps:
      - name: Download video
        run: |
          curl -L --fail --retry 3 -o BigBuckBunny480p30s.mp4 "https://raw.githubusercontent.com/chintan9/Big-Buck-Bunny/master/BigBuckBunny480p30s.mp4"
          test -s BigBuckBunny480p30s.mp4
          ls -lh BigBuckBunny480p30s.mp4
      - name: Create single self-contained HTML
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64encode(Path("BigBuckBunny480p30s.mp4").read_bytes()).decode("ascii")
          html = '''<!doctype html>
          <html lang="he" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Big Buck Bunny — אופליין</title>
          <style>
          html,body{margin:0;background:#0b0f14;color:#fff;font-family:Arial,sans-serif}
          body{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
          .card{width:min(960px,100%);background:#151b24;border-radius:20px;padding:18px;box-sizing:border-box}
          h1{text-align:center;font-size:28px}
          video{display:block;width:100%;border-radius:14px;background:#000}
          p{text-align:center;color:#b8c2cf}
          </style>
          </head>
          <body>
          <main class="card">
          <h1>🎬 Big Buck Bunny — אופליין</h1>
          <video controls playsinline preload="metadata">
          <source src="data:video/mp4;base64,''' + data + '''" type="video/mp4">
          </video>
          <p>הווידאו מוטמע בתוך קובץ ה‑HTML עצמו ואינו דורש אינטרנט.</p>
          </main>
          </body>
          </html>'''
          Path("Big_Buck_Bunny_OFFLINE.html").write_text(html, encoding="utf-8")
          print("HTML bytes:", Path("Big_Buck_Bunny_OFFLINE.html").stat().st_size)
          PY
      - name: Upload offline HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: big-buck-bunny-offline-html
          path: Big_Buck_Bunny_OFFLINE.html
          compression-level: 0

  full_movie_zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download full movie
        run: |
          curl -L --fail --retry 3 -o Big_Buck_Bunny_full.mp4 "https://raw.githubusercontent.com/andreasbotsikas/DemoVideos/master/big_buck_bunny.mp4"
          test -s Big_Buck_Bunny_full.mp4
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 Big_Buck_Bunny_full.mp4
          ls -lh Big_Buck_Bunny_full.mp4
      - name: Create ZIP
        run: |
          zip -9 Big_Buck_Bunny_full.zip Big_Buck_Bunny_full.mp4
          ls -lh Big_Buck_Bunny_full.zip
      - name: Upload full movie ZIP
        uses: actions/upload-artifact@v4
        with:
          name: big-buck-bunny-full-movie-zip
          path: Big_Buck_Bunny_full.zip
          compression-level: 0
