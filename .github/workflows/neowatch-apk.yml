name: Build NEOWATCH APK

on:
  push:
    branches: ["main", "neowatch-android"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neowatch-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neowatch-apk
          path: neowatch-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neowatch-latest
          name: NEOWATCH APK
          body: Android APK built automatically from the NEOWATCH wrapper.
          prerelease: true
          files: neowatch-android/app/build/outputs/apk/debug/app-debug.apk
