name: Build offline Big Buck Bunny HTML

on:
  push:
    paths:
      - ".github/workflows/offline-bunny.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download video
        run: |
          curl -L --fail --retry 3 -o bunny.mp4 "https://raw.githubusercontent.com/chintan9/Big-Buck-Bunny/master/BigBuckBunny480p30s.mp4"
          test -s bunny.mp4
          ls -lh bunny.mp4

      - name: Embed video into one HTML
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64encode(Path("bunny.mp4").read_bytes()).decode("ascii")
          html = '''<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Buck Bunny — אופליין</title>
<style>
html,body{margin:0;background:#0b0f14;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.card{width:min(960px,100%);background:#151b24;border-radius:20px;padding:18px;box-sizing:border-box}
h1{text-align:center;font-size:28px}
video{display:block;width:100%;border-radius:14px;background:#000}
p{text-align:center;color:#b8c2cf}
</style>
</head>
<body>
<main class="card">
<h1>🎬 Big Buck Bunny — אופליין</h1>
<video controls playsinline preload="metadata">
<source src="data:video/mp4;base64,''' + data + '''" type="video/mp4">
</video>
<p>הווידאו מוטמע בתוך קובץ ה‑HTML עצמו ואינו דורש אינטרנט.</p>
</main>
</body>
</html>'''
          Path("Big_Buck_Bunny_OFFLINE.html").write_text(html, encoding="utf-8")
          print("HTML bytes:", Path("Big_Buck_Bunny_OFFLINE.html").stat().st_size)
          PY
          ls -lh Big_Buck_Bunny_OFFLINE.html

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-bunny-html
          path: Big_Buck_Bunny_OFFLINE.html
          compression-level: 0
