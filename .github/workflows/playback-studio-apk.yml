name: Build Playback Studio APK

on:
  push:
    branches: ["main"]
    paths:
      - "playback-studio-android/**"
      - ".github/workflows/playback-studio-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playback-studio-android
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: playback-studio-apk
          path: playback-studio-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare direct APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk playback-studio.apk
      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: playback-studio-v1.0.0
          name: Playback Studio v1.0.0
          body: |
            פלייבק סטודיו — אפליקציית Android להקלטה, זיהוי מנגינה והפקת פלייבק בכינורות, פסנתר ותופים.
            הקובץ עובד מקומית במכשיר. זיהוי גובה הצלילים הוא משוער ומתאים במיוחד להקלטת קול יחיד.
          files: playback-studio-android/playback-studio.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
