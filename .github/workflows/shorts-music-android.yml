name: Build VYBE AI Chorus APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'shorts-music-android/**'
      - '.github/workflows/shorts-music-android.yml'

concurrency:
  group: vybe-ai-chorus-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build LinkSeg package from its upstream source
        run: |
          git clone https://github.com/elicwhite/LinkSeg-web.git /tmp/linkseg-web
          cd /tmp/linkseg-web
          git checkout 694d27356082712dc82a3e06dbf9c7d543c9e399
          npm install --no-audit --no-fund
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/shorts-music-android/vendor/linkseg-web"
          cp package.json README.md LICENSE "$GITHUB_WORKSPACE/shorts-music-android/vendor/linkseg-web/"
          cp -R dist "$GITHUB_WORKSPACE/shorts-music-android/vendor/linkseg-web/dist"

      - name: Install web dependencies and fetch the licensed AI model
        working-directory: shorts-music-android
        run: |
          npm install --no-audit --no-fund
          mkdir -p web/public
          curl --fail --location --retry 3 --retry-delay 2 \
            https://huggingface.co/elicwhite/linkseg-7c-onnx/resolve/main/linkseg_7c.onnx \
            --output web/public/linkseg_7c.onnx
          test "$(stat -c%s web/public/linkseg_7c.onnx)" -gt 1000000

      - name: Bundle AI engine and web player
        working-directory: shorts-music-android
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p shorts-music-android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-AI-Chorus-APK
          path: shorts-music-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vybe-ai-chorus
          name: VYBE AI Chorus APK
          body: "VYBE — local AI music structure analysis and chorus-only MP3 export."
          files: shorts-music-android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
