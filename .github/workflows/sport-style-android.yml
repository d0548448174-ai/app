name: Build Sport Style APK

on:
  push:
    branches:
      - sport-style
    paths:
      - 'sport-style/**'
      - '.github/workflows/sport-style-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check JavaScript syntax
        working-directory: sport-style
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline application script found')
          Path('/tmp/sport-style-app.js').write_text(scripts[-1], encoding='utf-8')
          print('Extracted application JavaScript for syntax checking')
          PY
          node --check /tmp/sport-style-app.js

      - name: Build debug APK
        working-directory: sport-style
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sport-style-apk
          path: sport-style/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/sport-style'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sport-style-latest
          name: Sport Style — APK עדכני
          body: |
            APK אוטומטי של Sport Style.
            
            התקנה: הורד את app-debug.apk למכשיר Android ואשר התקנה ממקור זה אם המכשיר יבקש.
            
            הערה: ניתוח BPM הוא אומדן מקומי; אין חיבור לשירות זיהוי שירים לפי מנגינה או לקטלוג סטרימינג.
          files: sport-style/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
