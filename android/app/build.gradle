plugins {
    id "com.android.application"
}

android {
    namespace "com.zipedia.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.zipedia.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ["wasm", "zim"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
