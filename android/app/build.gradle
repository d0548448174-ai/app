plugins {
    id "com.android.application"
}

android {
    namespace "com.zipedia.app"
    compileSdk 35

    signingConfigs {
        zipedia {
            storeFile rootProject.file("zipedia-signing.keystore")
            storePassword "ZipediaPublicSideloadKey2026"
            keyAlias "zipedia"
            keyPassword "ZipediaPublicSideloadKey2026"
        }
    }

    defaultConfig {
        applicationId "com.zipedia.app"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.zipedia
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.zipedia
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ["wasm", "zim"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
