plugins {
    id 'com.android.application'
}

android {
    namespace 'com.d0548448174ai.animeai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.d0548448174ai.animeai'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    androidResources {
        noCompress += ['tflite']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
}
