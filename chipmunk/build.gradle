plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'com.example.chipmunkvoice'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.chipmunkvoice'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
