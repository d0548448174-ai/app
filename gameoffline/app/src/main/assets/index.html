<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>גיים אופליין</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,'Segoe UI',sans-serif;background:#030a1c;color:#e6fbff}body{background:radial-gradient(110% 50% at 50% 0,#123c72 0,#071a37 52%,#030a1c 100%);min-height:100dvh}
main{max-width:760px;margin:auto;padding:18px 16px 32px}header{text-align:center;padding:10px 0 18px}.logo{font-size:52px;filter:drop-shadow(0 0 18px #35dfff)}h1{margin:2px;font-size:clamp(30px,8vw,44px);font-weight:900;background:linear-gradient(90deg,#7df9ff,#b6a4ff,#7df9ff);background-clip:text;-webkit-background-clip:text;color:transparent}header p{margin:3px;color:#9fd8e8;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;text-align:right;border:1px solid #3d7697;border-radius:20px;padding:16px 14px;background:linear-gradient(145deg,#143050d9,#071a31eF);box-shadow:0 8px 24px #0006;min-height:135px;color:#e9fbff;cursor:pointer;transition:transform .12s}.card:active{transform:scale(.97)}.emoji{font-size:36px}.name{font-size:18px;font-weight:850;margin-top:8px}.desc{font-size:12px;color:#a4d3e5;margin-top:2px}.play{float:left;background:#72f4ff;color:#041223;padding:6px 11px;border-radius:30px;font-size:12px;font-weight:900}
#game{display:none;max-width:640px;margin:0 auto}#game.active{display:block}#home.hide{display:none}.bar{display:flex;align-items:center;gap:10px;margin:4px 0 14px}.bar button,.action{border:0;border-radius:12px;padding:11px 16px;background:#72f4ff;color:#031225;font-weight:850;font-size:15px;cursor:pointer}.bar strong{font-size:21px;flex:1}.panel{border:1px solid #35718e;background:#06152be8;border-radius:20px;padding:16px;min-height:300px;text-align:center}.note{color:#a4d5e8;font-size:13px;min-height:22px;margin:6px}.board{margin:12px auto;max-width:380px;display:grid;gap:7px}.cell{border:0;border-radius:10px;background:#1b3551;color:#fff;font-size:22px;font-weight:900;aspect-ratio:1;cursor:pointer}.cell.empty{background:#10243a}.rowbtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.rowbtns button{border:0;border-radius:12px;background:#173d5a;color:white;padding:11px 15px;font-weight:800}.stagecanvas{display:block;max-width:100%;height:auto;max-height:58vh;margin:12px auto;border-radius:14px;touch-action:none;background:#071326}.memory{grid-template-columns:repeat(4,1fr);max-width:370px}.memory .cell{font-size:28px}.wide{width:100%;max-width:370px}.score{font-size:20px;font-weight:900;color:#7df9ff}footer{text-align:center;color:#6fabc3;font-size:12px;margin-top:20px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}button:focus-visible{outline:2px solid white;outline-offset:3px}
</style></head><body><main id="home"><header><div class="logo">🎮</div><h1>גיים אופליין</h1><p>10 משחקים · בלי אינטרנט · בכל מקום</p></header><section id="grid" class="grid"></section><footer>משחקים מקומיים • התקדמות נשמרת במכשיר</footer></main>
<section id="game"><div class="bar"><button id="back">← חזרה</button><strong id="title"></strong><span id="score" class="score"></span></div><div id="panel" class="panel"></div></section>
<script>
const games=[
['2048','🔢','מיזוג מספרים','מזגו אריחים עד 2048'],['memory','🧠','זיכרון','מצאו את כל הזוגות'],['snake','🐍','נחש','אכלו ואל תתנגשו'],['whack','🐹','חפרפרת','תפסו כמה שיותר'],['flappy','🐦','ציפור קופצת','עברו בין המכשולים'],['simon','🎵','סיימון','זכרו את הסדר'],['stack','🏗️','מגדל','בנו מגדל גבוה'],['tap','⚡','מקש הבזק','לחצו מהר במשך 5 שניות'],['pong','🏓','פונג','החזיקו את הכדור במשחק'],['breakout','🧱','שובר לבנים','שברו את כל הלבנים']];
const $=id=>document.getElementById(id),grid=$('grid'),panel=$('panel');let clean=()=>{};games.forEach(g=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="play">שחקו ▶</span><div class="emoji">'+g[1]+'</div><div class="name">'+g[2]+'</div><div class="desc">'+g[3]+'</div>';b.onclick=()=>start(g);grid.appendChild(b)});
function base(g,html){$('home').classList.add('hide');$('game').classList.add('active');$('title').textContent=g[2];$('score').textContent='';panel.innerHTML=html;clean=()=>{}}
function stop(){clean();clean=()=>{};$('game').classList.remove('active');$('home').classList.remove('hide');panel.innerHTML=''}
$('back').onclick=stop;function btn(t,fn){let b=document.createElement('button');b.className='action';b.textContent=t;b.onclick=fn;return b}
function start(g){if(g[0]==='2048')return game2048(g);if(g[0]==='memory')return memory(g);if(g[0]==='snake')return snake(g);if(g[0]==='tap')return tap(g);if(g[0]==='whack')return whack(g);if(g[0]==='simon')return simon(g);if(g[0]==='stack')return stack(g);if(g[0]==='flappy')return flappy(g);if(g[0]==='pong')return pong(g);if(g[0]==='breakout')return breakout(g)}
function game2048(g){base(g,'<div class="note">החליקו על הלוח או השתמשו בחצים</div><div id="b" class="board" style="grid-template-columns:repeat(4,1fr)"></div><div class="rowbtns" id="ar"></div>');let a=Array(16).fill(0),score=0,over=false;function spawn(){let e=a.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(e.length)a[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}function render(){let b=$('b');b.innerHTML='';a.forEach(v=>{let c=document.createElement('button');c.className='cell'+(!v?' empty':'');c.textContent=v||'';c.style.background=v?'hsl('+(35+Math.log2(v)*24)+',65%,'+(Math.min(75,28+Math.log2(v)*5))+'%)':'#10243a';b.appendChild(c)});$('score').textContent=score}function move(dir){let changed=false;for(let n=0;n<4;n++){let ids=[];for(let k=0;k<4;k++)ids.push(dir==='left'?n*4+k:dir==='right'?n*4+3-k:dir==='up'?k*4+n:(3-k)*4+n);let old=ids.map(i=>a[i]),vals=old.filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);score+=vals[i]*2;i++}else out.push(vals[i])}while(out.length<4)out.push(0);ids.forEach((id,i)=>{if(a[id]!==out[i])changed=true;a[id]=out[i]})}if(changed)spawn();render()}spawn();spawn();render();['↑','←','↓','→'].forEach((v,i)=>$('ar').appendChild(btn(v,()=>move(['up','left','down','right'][i]))));let key=e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}};let x0=0,y0=0;panel.ontouchstart=e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY};panel.ontouchend=e=>{let dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))};addEventListener('keydown',key);clean=()=>{removeEventListener('keydown',key);panel.ontouchstart=null;panel.ontouchend=null}}
function memory(g){base(g,'<div class="note">מצאו את כל הזוגות</div><div id="b" class="board memory"></div><div id="msg" class="note"></div>');let vals=['🐳','🍀','🚀','🍉','🎸','🐱','⭐','🍓','🐳','🍀','🚀','🍉','🎸','🐱','⭐','🍓'].sort(()=>Math.random()-.5),open=[],done=new Set(),moves=0;function draw(){let b=$('b');b.innerHTML='';vals.forEach((v,i)=>{let c=btn(done.has(i)||open.includes(i)?v:'?',()=>flip(i));c.className='cell';c.style.background=done.has(i)?'#17634d':'#193955';c.style.fontSize='27px';b.appendChild(c)});$('score').textContent=moves+' מהלכים'}function flip(i){if(done.has(i)||open.includes(i)||open.length===2)return;open.push(i);draw();if(open.length===2){moves++;if(vals[open[0]]===vals[open[1]]){open.forEach(j=>done.add(j));open=[];draw();if(done.size===16)$('msg').textContent='כל הכבוד! ניצחתם 🎉'}else setTimeout(()=>{open=[];draw()},650)}}draw()}
function tap(g){base(g,'<div class="note">כמה פעמים תצליחו ללחוץ ב־5 שניות?</div><div id="n" style="font-size:58px;font-weight:900;margin:34px">0</div><div id="b" class="rowbtns"></div><div id="msg" class="note">לחצו התחלה</div>');let n=0,left=5,timer=null,run=false;$('b').appendChild(btn('התחלה',()=>{n=0;left=5;run=true;$('n').textContent=n;$('msg').textContent='קדימה!';timer=setInterval(()=>{left-=.1;$('msg').textContent='נותרו '+Math.max(0,left).toFixed(1)+' שניות';if(left<=0){clearInterval(timer);run=false;$('msg').textContent='סיימתם! תוצאה: '+n}},100)}));$('b').appendChild(btn('לחצו כאן!',()=>{if(run){n++;$('n').textContent=n}}));clean=()=>clearInterval(timer)}
function whack(g){base(g,'<div class="note">תפסו את החפרפרת בתוך 20 שניות</div><div id="b" class="board" style="grid-template-columns:repeat(3,1fr)"></div><div id="msg" class="note"></div>');let n=0,left=20,pos=-1,iv,tick;function draw(){let b=$('b');b.innerHTML='';for(let i=0;i<9;i++){let c=btn(i===pos?'🐹':'🕳️',()=>{if(i===pos){n++;$('score').textContent=n;pos=-1;draw()}});c.style.fontSize='30px';c.style.aspectRatio='1';b.appendChild(c)}}draw();iv=setInterval(()=>{pos=Math.random()*9|0;draw()},700);tick=setInterval(()=>{left--;$('msg').textContent='זמן: '+left+' שניות';if(left<=0){clearInterval(iv);clearInterval(tick);pos=-1;draw();$('msg').textContent='נגמר הזמן! ניקוד: '+n}},1000);clean=()=>{clearInterval(iv);clearInterval(tick)}}
function simon(g){base(g,'<div class="note" id="msg">לחצו התחלה וזכרו את הסדר</div><div id="b" class="board" style="grid-template-columns:repeat(2,1fr)"></div><div id="ar" class="rowbtns"></div>');let seq=[],step=0,locked=true,colors=['#22c55e','#ef4444','#eab308','#3b82f6'],timers=[];colors.forEach((c,i)=>{let b=btn('●',()=>hit(i));b.style.background=c;b.style.height='110px';b.style.fontSize='30px';$('b').appendChild(b)});function show(){locked=true;step=0;$('msg').textContent='צפו בסדר...';seq.forEach((v,i)=>timers.push(setTimeout(()=>{let el=$('b').children[v];el.style.filter='brightness(1.8)';setTimeout(()=>el.style.filter='',230)},i*550+150)));timers.push(setTimeout(()=>{locked=false;$('msg').textContent='עכשיו תורכם!'},seq.length*550+200))}function next(){seq.push(Math.random()*4|0);$('score').textContent='שלב '+seq.length;show()}function hit(i){if(locked||!seq.length)return;if(i!==seq[step]){locked=true;$('msg').textContent='טעות! שלב שהושלם: '+(seq.length-1);return}step++;if(step===seq.length){locked=true;timers.push(setTimeout(next,600))}}$('ar').appendChild(btn('התחלה / שוב',()=>{seq=[];next()}));clean=()=>timers.forEach(clearTimeout)}
function stack(g){base(g,'<div class="note">לחצו כדי להניח שכבה</div><canvas id="c" class="stagecanvas" width="320" height="380"></canvas><div class="rowbtns" id="ar"></div>');let c=$('c'),x=c.getContext('2d'),blocks=[],w=110,pos=0,dir=1,score=0,timer;function draw(){x.fillStyle='#071326';x.fillRect(0,0,320,380);for(let i=0;i<blocks.length;i++){x.fillStyle='hsl('+(190+i*20%150)+',80%,60%)';x.fillRect(blocks[i].x,350-i*25,blocks[i].w,22)}x.fillStyle='#7df9ff';x.fillRect(pos,350-blocks.length*25,w,22);if(blocks.length<12){pos+=dir*3;if(pos<0||pos+w>320)dir*=-1}requestAnimationFrame(draw)}function drop(){if(blocks.length===0){blocks.push({x:pos,w});pos=30;return}let last=blocks[blocks.length-1],left=Math.max(pos,last.x),right=Math.min(pos+w,last.x+last.w),nw=right-left;if(nw<8){$('score').textContent='נגמר! '+score;return}blocks.push({x:left,w:nw});score++;w=nw;pos=Math.min(pos,320-w);$('score').textContent='גובה '+score} $('ar').appendChild(btn('הניחו שכבה',drop));c.onclick=drop;draw();clean=()=>{c.onclick=null}}
function flappy(g){base(g,'<div class="note">געו במסך כדי לקפוץ</div><canvas id="c" class="stagecanvas" width="320" height="430"></canvas><div class="rowbtns" id="ar"></div>');let c=$('c'),x=c.getContext('2d'),y=200,vy=0,pipes=[],score=0,dead=false,run=false,raf;function reset(){y=200;vy=0;pipes=[];score=0;dead=false;run=true}function frame(){x.fillStyle='#79cbd4';x.fillRect(0,0,320,430);x.fillStyle='#55a64d';pipes.forEach(p=>{x.fillRect(p.x,0,42,p.gap-58);x.fillRect(p.x,p.gap+58,42,380-p.gap)});x.fillStyle='#ffd34f';x.beginPath();x.arc(84,y,12,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(88,y-4,4,0,7);x.fill();if(run){vy+=.34;y+=vy;if(!pipes.length||pipes[pipes.length-1].x<175)pipes.push({x:320,gap:100+Math.random()*220,sc:false});pipes.forEach(p=>{p.x-=2.1;if(!p.sc&&p.x<70){p.sc=true;score++;$('score').textContent=score}if(p.x<103&&p.x+42>65&&(y<p.gap-58||y>p.gap+58))run=false});pipes=pipes.filter(p=>p.x>-45);if(y>410||y<0)run=false}if(!run){x.fillStyle='#06152b';x.fillRect(20,170,280,78);x.fillStyle='white';x.font='20px sans-serif';x.textAlign='center';x.fillText('ניקוד '+score+' · לחצו לשחק',160,215)}raf=requestAnimationFrame(frame)}function flap(){if(!run)reset();vy=-6}c.onpointerdown=flap; $('ar').appendChild(btn('התחלה מחדש',reset));frame();reset();clean=()=>{cancelAnimationFrame(raf);c.onpointerdown=null}}
function pong(g){base(g,'<div class="note">גררו את המחבט כדי להחזיר את הכדור</div><canvas id="c" class="stagecanvas" width="320" height="430"></canvas><div id="msg" class="note"></div>');let c=$('c'),x=c.getContext('2d'),p=105,bx=160,by=150,vx=3,vy=3,n=0,raf,down=false;function frame(){x.fillStyle='#071326';x.fillRect(0,0,320,430);x.strokeStyle='#24536b';x.setLineDash([7,8]);x.beginPath();x.moveTo(0,215);x.lineTo(320,215);x.stroke();x.setLineDash([]);x.fillStyle='#7df9ff';x.fillRect(p,395,90,12);x.fillStyle='#ffcb6b';x.beginPath();x.arc(bx,by,8,0,7);x.fill();bx+=vx;by+=vy;if(bx<8||bx>312)vx*=-1;if(by<8)vy*=-1;if(vy>0&&by>=387&&bx>p&&bx<p+90){vy=-Math.abs(vy);n++;$('score').textContent=n}if(by>435){$('msg').textContent='המשחק הסתיים';by=80;bx=160;vy=3}raf=requestAnimationFrame(frame)}function move(e){let r=c.getBoundingClientRect();p=Math.max(0,Math.min(230,(e.clientX-r.left)*320/r.width-45))}c.onpointermove=move;frame();clean=()=>{cancelAnimationFrame(raf);c.onpointermove=null}}
function breakout(g){base(g,'<div class="note">גררו את המחבט ושברו את הלבנים</div><div id="msg" class="note"></div><canvas id="c" class="stagecanvas" width="320" height="430"></canvas><div class="rowbtns" id="ar"></div>');let c=$('c'),x=c.getContext('2d'),p=110,bx=160,by=330,vx=2.5,vy=-3,n=0,bricks=[],raf,dead=false;for(let r=0;r<5;r++)for(let k=0;k<7;k++)bricks.push({x:5+k*45,y:30+r*25,on:true,color:['#38e8ff','#a78bfa','#fb7185','#fbbf24','#34d399'][r]});function reset(){p=110;bx=160;by=330;vx=2.5;vy=-3;n=0;dead=false;bricks.forEach(b=>b.on=true);$('score').textContent='0'}function frame(){x.fillStyle='#070d20';x.fillRect(0,0,320,430);bricks.forEach(b=>{if(b.on){x.fillStyle=b.color;x.fillRect(b.x,b.y,40,17)}});x.fillStyle='#7df9ff';x.fillRect(p,400,85,10);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,7,0,7);x.fill();if(!dead){bx+=vx;by+=vy;if(bx<7||bx>313)vx*=-1;if(by<7)vy=Math.abs(vy);if(by>388&&bx>=p&&bx<=p+85&&vy>0)vy=-Math.abs(vy);let hit=bricks.find(b=>b.on&&bx>=b.x&&bx<=b.x+40&&by>=b.y&&by<=b.y+17);if(hit){hit.on=false;vy*=-1;n++;$('score').textContent=n}if(by>430||bricks.every(b=>!b.on)){dead=true;$('msg').textContent=by>430?'הכדור נפל! ניקוד '+n:'ניצחתם! ניקוד '+n}}raf=requestAnimationFrame(frame)}c.onpointermove=e=>{let r=c.getBoundingClientRect();p=Math.max(0,Math.min(235,(e.clientX-r.left)*320/r.width-42))};$('ar').appendChild(btn('משחק חדש',()=>{reset();$('msg').textContent=''}));frame();clean=()=>{cancelAnimationFrame(raf);c.onpointermove=null}}
</script></body></html>
