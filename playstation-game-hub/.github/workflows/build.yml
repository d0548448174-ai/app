name: Build GameStation Hub
on:
  workflow_dispatch:
  push:
    paths:
      - 'playstation-game-hub/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: playstation-game-hub
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GameStation-Hub-debug
          path: playstation-game-hub/app/build/outputs/apk/debug/app-debug.apk
